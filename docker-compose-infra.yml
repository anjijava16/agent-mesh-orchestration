# Docker Compose - Infrastructure Only
# Use this for local development: infrastructure in Docker, applications run locally
# Usage: docker compose -f docker-compose-infra.yml up -d

version: '3.9'

services:
  # ---- PostgreSQL Database -----------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: agentmesh-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentmesh}
      POSTGRES_DB: ${POSTGRES_DB:-agentmesh}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"  # Using 5433 on host to avoid conflict with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentmesh}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---- Redis Cache & Message Broker --------------------------------------
  redis:
    image: redis:7-alpine
    container_name: agentmesh-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ---- OpenSearch (Vector Search & Full-Text) ----------------------------
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: agentmesh-opensearch
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:-Agentmesh#2026}
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  # ---- OpenSearch Dashboards (Optional - for visualization) --------------
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: agentmesh-dashboards
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---- MinIO (S3-Compatible Object Storage) ------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: agentmesh-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---- MinIO Bucket Initialization ---------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: agentmesh-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY:-minioadmin} ${STORAGE_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/${STORAGE_BUCKET:-agentmesh-uploads};
      mc anonymous set download local/${STORAGE_BUCKET:-agentmesh-uploads};
      exit 0;
      "
    restart: "no"

  # ---- MongoDB (Atlas Vector Search Alternative) -------------------------
  mongodb:
    image: mongo:7
    container_name: agentmesh-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ---- Neo4j Graph Database (Knowledge Graph) ----------------------------
  neo4j:
    image: neo4j:5-community
    container_name: agentmesh-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-agentmesh}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---- Arize Phoenix (AI Observability) ----------------------------------
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: agentmesh-phoenix
    ports:
      - "6006:6006"    # Phoenix UI
      - "4317:4317"    # OTLP gRPC collector
      - "4318:4318"    # OTLP HTTP collector
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentmesh}:${POSTGRES_PASSWORD:-agentmesh}@postgres:5432/phoenix
      PHOENIX_WORKING_DIR: /phoenix/data
    volumes:
      - phoenix_data:/phoenix/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  # ---- LiteLLM Proxy (Unified LLM Gateway) -------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: agentmesh-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agentmesh}:${POSTGRES_PASSWORD:-agentmesh}@postgres:5432/${POSTGRES_DB:-agentmesh}
      STORE_MODEL_IN_DB: "true"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-agentmesh-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      UI_USERNAME: admin
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:-admin}
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health/liveliness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---- Pinecone Local (Optional - Vector DB Alternative) -----------------
  pinecone:
    image: ghcr.io/pinecone-io/pinecone-local:latest
    container_name: agentmesh-pinecone
    ports:
      - "5081:5081"
      - "5082:5082"
      - "5083:5083"
      - "5084:5084"
      - "5085:5085"
      - "5086:5086"
      - "5087:5087"
      - "5088:5088"
      - "5089:5089"
      - "5090:5090"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

# ---- Volumes (Persistent Data) -----------------------------------------
volumes:
  postgres_data:
    name: agentmesh_postgres_data
  redis_data:
    name: agentmesh_redis_data
  opensearch_data:
    name: agentmesh_opensearch_data
  minio_data:
    name: agentmesh_minio_data
  mongodb_data:
    name: agentmesh_mongodb_data
  mongodb_config:
    name: agentmesh_mongodb_config
  neo4j_data:
    name: agentmesh_neo4j_data
  neo4j_logs:
    name: agentmesh_neo4j_logs
  phoenix_data:
    name: agentmesh_phoenix_data

# ---- Networks ----------------------------------------------------------
networks:
  default:
    name: agentmesh_network
    driver: bridge

# AgentMesh - full local stack.
#
#   docker compose up -d --build
#   docker compose exec backend alembic upgrade head
#   open http://localhost:8080
#
# Every service has a healthcheck and every dependent waits on it. That is what
# makes `up` deterministic instead of a race between the API and a cold
# OpenSearch node.

name: agentmesh

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}

  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-agentmesh}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentmesh}
  POSTGRES_DB: ${POSTGRES_DB:-agentmesh}

  OPENSEARCH_HOST: opensearch
  OPENSEARCH_PORT: 9200
  OPENSEARCH_USER: ${OPENSEARCH_USER:-admin}
  OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-Agentmesh#2026}
  OPENSEARCH_USE_SSL: "false"
  OPENSEARCH_EMBEDDING_DIM: ${OPENSEARCH_EMBEDDING_DIM:-1536}

  REDIS_HOST: redis
  REDIS_PORT: 6379

  STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
  STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
  STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-agentmesh-uploads}

  AGENT_FRAMEWORK: ${AGENT_FRAMEWORK:-langgraph}
  AGENT_PROVIDER: ${AGENT_PROVIDER:-anthropic}
  AGENT_MODEL: ${AGENT_MODEL:-claude-sonnet-4-6}
  AGENT_TEMPERATURE: ${AGENT_TEMPERATURE:-0.2}
  AGENT_ENABLE_LONG_TERM_MEMORY: ${AGENT_ENABLE_LONG_TERM_MEMORY:-true}

  INGESTION_EMBEDDING_PROVIDER: ${INGESTION_EMBEDDING_PROVIDER:-openai}
  INGESTION_EMBEDDING_MODEL: ${INGESTION_EMBEDDING_MODEL:-text-embedding-3-small}

  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentmesh-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentmesh}
      POSTGRES_DB: ${POSTGRES_DB:-agentmesh}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentmesh} -d ${POSTGRES_DB:-agentmesh}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agentmesh-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: agentmesh-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      # Local only. In any shared environment turn the security plugin back on
      # and put real certificates in front of it.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-Agentmesh#2026}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["9200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: agentmesh-dashboards
    profiles: ["tools"]
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports: ["5601:5601"]
    depends_on:
      opensearch: { condition: service_healthy }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: agentmesh-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: agentmesh-minio-init
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-agentmesh-uploads} &&
      mc anonymous set none local/${STORAGE_BUCKET:-agentmesh-uploads} &&
      echo 'bucket ready'
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentmesh-backend
    environment:
      <<: *backend-env
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentmesh-worker
    # -Q ingest: this worker only takes document work. Scale it independently
    # of the API; embedding throughput is the usual bottleneck.
    command: >
      celery -A app.ingestion.celery_app.celery_app worker
      --loglevel=INFO --concurrency=2 -Q ingest,default
      --max-tasks-per-child=50
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.ingestion.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentmesh-flower
    profiles: ["tools"]
    command: celery -A app.ingestion.celery_app.celery_app flower --port=5555
    environment: *backend-env
    ports: ["5555:5555"]
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentmesh-frontend
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  osdata:
  miniodata:

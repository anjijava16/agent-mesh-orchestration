# AgentMesh - full local stack.
#
#   docker compose up -d --build
#   docker compose exec backend alembic upgrade head
#   open http://localhost:8080
#
# Every service has a healthcheck and every dependent waits on it. That is what
# makes `up` deterministic instead of a race between the API and a cold
# OpenSearch node.

name: agentmesh

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
  LOG_FORMAT: ${LOG_FORMAT:-console}

  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-agentmesh}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentmesh}
  POSTGRES_DB: ${POSTGRES_DB:-agentmesh}

  OPENSEARCH_HOST: opensearch
  OPENSEARCH_PORT: 9200
  OPENSEARCH_USER: ${OPENSEARCH_USER:-admin}
  OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-Agentmesh#2026}
  OPENSEARCH_USE_SSL: "false"
  OPENSEARCH_EMBEDDING_DIM: ${OPENSEARCH_EMBEDDING_DIM:-1536}

  REDIS_HOST: redis
  REDIS_PORT: 6379

  STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
  STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
  STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-agentmesh-uploads}

  AGENT_FRAMEWORK: ${AGENT_FRAMEWORK:-langgraph}
  AGENT_PROVIDER: ${AGENT_PROVIDER:-anthropic}
  AGENT_MODEL: ${AGENT_MODEL:-claude-sonnet-4-6}
  AGENT_TEMPERATURE: ${AGENT_TEMPERATURE:-0.2}
  AGENT_ENABLE_LONG_TERM_MEMORY: ${AGENT_ENABLE_LONG_TERM_MEMORY:-true}

  INGESTION_EMBEDDING_PROVIDER: ${INGESTION_EMBEDDING_PROVIDER:-openai}
  INGESTION_EMBEDDING_MODEL: ${INGESTION_EMBEDDING_MODEL:-text-embedding-3-small}

  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  SEARCH_PROVIDER: ${SEARCH_PROVIDER:-auto}

  # Arize Phoenix (AI Observability)
  PHOENIX_ENABLED: ${PHOENIX_ENABLED:-true}
  PHOENIX_HOST: phoenix
  PHOENIX_GRPC_PORT: 4317
  OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:4317

  # Neo4j (Graph DB)
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/agentmesh2026}

  # Opik (Comet AI Observability)
  OPIK_ENABLED: ${OPIK_ENABLED:-true}
  OPIK_URL: http://opik-backend:8080
  OPIK_URL_OVERRIDE: http://opik-backend:8080

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentmesh-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentmesh}
      POSTGRES_DB: ${POSTGRES_DB:-agentmesh}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentmesh} -d ${POSTGRES_DB:-agentmesh}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agentmesh-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: agentmesh-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      # Local only. In any shared environment turn the security plugin back on
      # and put real certificates in front of it.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-Agentmesh#2026}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["9200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: agentmesh-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports: ["5601:5601"]
    depends_on:
      opensearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: agentmesh-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: agentmesh-minio-init
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-agentmesh-uploads} &&
      mc anonymous set none local/${STORAGE_BUCKET:-agentmesh-uploads} &&
      echo 'bucket ready'
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentmesh-backend
    environment:
      <<: *backend-env
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      minio: { condition: service_healthy }
      phoenix: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentmesh-worker
    # -Q ingest: this worker only takes document work. Scale it independently
    # of the API; embedding throughput is the usual bottleneck.
    command: >
      celery -A app.ingestion.celery_app.celery_app worker
      --loglevel=INFO --concurrency=2 -Q ingest,default
      --max-tasks-per-child=50
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.ingestion.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentmesh-flower
    profiles: ["tools"]
    command: celery -A app.ingestion.celery_app.celery_app flower --port=5555
    environment: *backend-env
    ports: ["5555:5555"]
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentmesh-frontend
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_started }
    restart: unless-stopped

  # ---- AI Observability: Arize Phoenix ------------------------------------
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: agentmesh-phoenix
    ports:
      - "6006:6006"    # Phoenix UI
      - "4317:4317"    # OTLP gRPC collector
      - "4318:4318"    # OTLP HTTP collector
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentmesh}:${POSTGRES_PASSWORD:-agentmesh}@postgres:5432/phoenix
      PHOENIX_WORKING_DIR: /phoenix/data
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  # ---- Graph Database: Neo4j -----------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: agentmesh-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/agentmesh2026}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      - "7474:7474"    # Neo4j Browser / HTTP API
      - "7687:7687"    # Bolt protocol
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---- AI Observability: Opik (Comet) ---------------------------------------
  # Opik requires its own infrastructure: MySQL, ClickHouse, Zookeeper, Redis, MinIO.
  # All prefixed with opik- to avoid clashing with our existing services.
  # UI: http://localhost:5173
  opik-mysql:
    image: mysql:8.4.2
    container_name: agentmesh-opik-mysql
    environment:
      MYSQL_ROOT_PASSWORD: opik
      MYSQL_DATABASE: opik
      MYSQL_USER: opik
      MYSQL_PASSWORD: opik
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      timeout: 1s
      interval: 5s
      retries: 60
    volumes:
      - opik-mysql:/var/lib/mysql
    restart: unless-stopped

  opik-redis:
    image: redis:7-alpine
    container_name: agentmesh-opik-redis
    command: redis-server --requirepass opik
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "opik", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - opik-redis:/data
    restart: unless-stopped

  opik-zookeeper:
    image: zookeeper:3.9.4
    container_name: agentmesh-opik-zookeeper
    environment:
      JVMFLAGS: "-Xmx256m"
      ZOO_4LW_COMMANDS_WHITELIST: "srvr,ruok"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep -q imok"]
      interval: 5s
      timeout: 3s
      retries: 60
    volumes:
      - opik-zookeeper:/data
    restart: unless-stopped

  opik-clickhouse:
    image: clickhouse/clickhouse-server:26.3.16.16-alpine
    container_name: agentmesh-opik-clickhouse
    hostname: opik-clickhouse
    environment:
      CLICKHOUSE_DB: opik
      CLICKHOUSE_USER: opik
      CLICKHOUSE_PASSWORD: opik
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 60
    volumes:
      - opik-clickhouse:/var/lib/clickhouse
      - ./infra/opik/clickhouse_config/macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./infra/opik/clickhouse_config/zookeeper.xml:/etc/clickhouse-server/config.d/zookeeper.xml:ro
      - ./infra/opik/clickhouse_config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./infra/opik/clickhouse_config/users.d/enable_time_type.xml:/etc/clickhouse-server/users.d/enable_time_type.xml:ro
    depends_on:
      opik-zookeeper: { condition: service_healthy }
    restart: unless-stopped

  opik-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: agentmesh-opik-minio
    command: server --console-address ":9090" /data
    environment:
      MINIO_ROOT_USER: opikadmin
      MINIO_ROOT_PASSWORD: opikadmin123
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - opik-minio:/data
    restart: unless-stopped

  opik-minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: agentmesh-opik-minio-init
    depends_on:
      opik-minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mc alias set s3 http://opik-minio:9000 opikadmin opikadmin123 --api S3v4 &&
      mc mb --ignore-existing s3/public &&
      mc anonymous set download s3/public/ &&
      echo 'opik bucket ready'
      "

  opik-backend:
    image: ghcr.io/comet-ml/opik/opik-backend:latest
    container_name: agentmesh-opik-backend
    hostname: opik-backend
    ports:
      - "3003:3003"    # OpenAPI spec
      - "8083:8080"    # Opik backend API
    environment:
      STATE_DB_PROTOCOL: "jdbc:mysql://"
      STATE_DB_URL: "opik-mysql:3306/opik?createDatabaseIfNotExist=true&rewriteBatchedStatements=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
      STATE_DB_DATABASE_NAME: opik
      STATE_DB_USER: opik
      STATE_DB_PASS: opik
      ANALYTICS_DB_MIGRATIONS_URL: "jdbc:clickhouse://opik-clickhouse:8123"
      ANALYTICS_DB_MIGRATIONS_USER: opik
      ANALYTICS_DB_MIGRATIONS_PASS: opik
      ANALYTICS_DB_PROTOCOL: "HTTP"
      ANALYTICS_DB_HOST: "opik-clickhouse"
      ANALYTICS_DB_PORT: 8123
      ANALYTICS_DB_DATABASE_NAME: opik
      ANALYTICS_DB_USERNAME: opik
      ANALYTICS_DB_PASS: opik
      REDIS_URL: redis://:opik@opik-redis:6379/
      AWS_ACCESS_KEY_ID: opikadmin
      AWS_SECRET_ACCESS_KEY: opikadmin123
      IS_MINIO: "true"
      S3_URL: http://opik-minio:9000
      JAVA_OPTS: "-Dliquibase.propertySubstitutionEnabled=true -XX:+UseG1GC -XX:MaxRAMPercentage=80.0"
      OPIK_USAGE_REPORT_ENABLED: "false"
      CORS: "true"
    command: ["bash", "-c", "./run_db_migrations.sh && ./entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health-check"]
      interval: 10s
      timeout: 30s
      retries: 60
      start_period: 60s
    depends_on:
      opik-mysql: { condition: service_healthy }
      opik-clickhouse: { condition: service_healthy }
      opik-minio: { condition: service_healthy }
      opik-redis: { condition: service_healthy }
    restart: unless-stopped

  opik-frontend:
    image: ghcr.io/comet-ml/opik/opik-frontend:latest
    container_name: agentmesh-opik-frontend
    ports:
      - "5174:5174"    # Opik UI
    environment:
      NGINX_PORT: 5174
    volumes:
      - ./infra/opik/nginx_local.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      opik-backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5174/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  osdata:
  miniodata:
  neo4jdata:
  neo4jlogs:
  opik-mysql:
  opik-redis:
  opik-zookeeper:
  opik-clickhouse:
  opik-minio:

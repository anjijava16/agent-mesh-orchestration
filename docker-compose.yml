# AgentMesh - full local stack.
#
#   docker compose up -d --build
#   docker compose exec backend alembic upgrade head
#   open http://localhost:8080
#
# Every service has a healthcheck and every dependent waits on it. That is what
# makes `up` deterministic instead of a race between the API and a cold
# OpenSearch node.

name: agentmesh

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
  LOG_FORMAT: ${LOG_FORMAT:-console}

  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-agentmesh}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentmesh}
  POSTGRES_DB: ${POSTGRES_DB:-agentmesh}

  OPENSEARCH_HOST: opensearch
  OPENSEARCH_PORT: 9200
  OPENSEARCH_USER: ${OPENSEARCH_USER:-admin}
  OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-Agentmesh#2026}
  OPENSEARCH_USE_SSL: "false"
  OPENSEARCH_EMBEDDING_DIM: ${OPENSEARCH_EMBEDDING_DIM:-1536}

  REDIS_HOST: redis
  REDIS_PORT: 6379

  STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
  STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
  STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-agentmesh-uploads}

  AGENT_FRAMEWORK: ${AGENT_FRAMEWORK:-langgraph}
  AGENT_PROVIDER: ${AGENT_PROVIDER:-anthropic}
  AGENT_MODEL: ${AGENT_MODEL:-claude-sonnet-4-6}
  AGENT_TEMPERATURE: ${AGENT_TEMPERATURE:-0.2}
  AGENT_ENABLE_LONG_TERM_MEMORY: ${AGENT_ENABLE_LONG_TERM_MEMORY:-true}

  INGESTION_EMBEDDING_PROVIDER: ${INGESTION_EMBEDDING_PROVIDER:-openai}
  INGESTION_EMBEDDING_MODEL: ${INGESTION_EMBEDDING_MODEL:-text-embedding-3-small}

  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  SEARCH_PROVIDER: ${SEARCH_PROVIDER:-auto}

  # LiteLLM Proxy (model gateway)
  LITELLM_ENABLED: ${LITELLM_ENABLED:-true}
  LITELLM_BASE_URL: http://litellm:4000
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-agentmesh-local}

  # MongoDB (alternative vector backend)
  VECTOR_BACKEND: ${VECTOR_BACKEND:-opensearch}
  MONGODB_URI: mongodb://mongodb:27017
  MONGODB_DATABASE: agentmesh

  # MCP Tool Servers
  MCP_DOCUMENTS_URL: http://mcp-documents:8081
  MCP_SEARCH_URL: http://mcp-search:8082
  MCP_MEMORY_URL: http://mcp-memory:8083

  # Arize Phoenix (AI Observability)
  PHOENIX_ENABLED: ${PHOENIX_ENABLED:-true}
  PHOENIX_HOST: phoenix
  PHOENIX_GRPC_PORT: 4317
  OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:4317

  # Neo4j (Graph DB)
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/agentmesh2026}

  # Opik (Comet AI Observability) — disabled by default, set OPIK_ENABLED=true to enable
  OPIK_ENABLED: ${OPIK_ENABLED:-false}
  OPIK_URL: http://opik-backend:8080
  OPIK_URL_OVERRIDE: http://opik-backend:8080

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentmesh-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentmesh}
      POSTGRES_DB: ${POSTGRES_DB:-agentmesh}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentmesh} -d ${POSTGRES_DB:-agentmesh}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agentmesh-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: agentmesh-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      # Local only. In any shared environment turn the security plugin back on
      # and put real certificates in front of it.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-Agentmesh#2026}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["9200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: agentmesh-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports: ["5601:5601"]
    depends_on:
      opensearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: agentmesh-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: agentmesh-minio-init
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-agentmesh-uploads} &&
      mc anonymous set none local/${STORAGE_BUCKET:-agentmesh-uploads} &&
      echo 'bucket ready'
      "

  # ---- LLM Gateway: LiteLLM Proxy -----------------------------------------
  # Single egress point for all model traffic. Routes to OpenAI, Anthropic,
  # Google through one gateway with latency-based routing, fallbacks, spend
  # tracking, and unified logging. UI at http://localhost:4000/ui.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: agentmesh-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-agentmesh-local}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-salt-1234567890abcdef}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agentmesh}:${POSTGRES_PASSWORD:-agentmesh}@postgres:5432/${POSTGRES_DB:-agentmesh}
      STORE_MODEL_IN_DB: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports: ["4000:4000"]
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health/liveliness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 45s
    restart: unless-stopped

  # ---- MCP Tool Servers ---------------------------------------------------
  # Three independent MCP servers in agentservices/mcp/:
  # - mcp-documents (8081): document management, metadata, search
  # - mcp-search (8082): web search, corpus overview
  # - mcp-memory (8083): long-term memory recall, store, forget
  # Each is a standalone microservice with its own Dockerfile and dependencies.
  mcp-documents:
    build:
      context: ./agentservices/mcp/mcp-documents
      dockerfile: Dockerfile
    container_name: agentmesh-mcp-documents
    environment:
      MCP_SERVER_NAME: documents
      MCP_SERVER_PORT: 8081
      MCP_SERVER_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-agentmesh}:${POSTGRES_PASSWORD:-agentmesh}@postgres:5432/${POSTGRES_DB:-agentmesh}
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      OPENSEARCH_USER: ${OPENSEARCH_USER:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-Agentmesh#2026}
      OPENSEARCH_USE_SSL: "false"
      OPENSEARCH_DOCUMENTS_INDEX: ${OPENSEARCH_DOCUMENTS_INDEX:-agentmesh-documents}
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mcp-search:
    build:
      context: ./agentservices/mcp/mcp-search
      dockerfile: Dockerfile
    container_name: agentmesh-mcp-search
    environment:
      MCP_SERVER_NAME: search
      MCP_SERVER_PORT: 8082
      MCP_SERVER_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-auto}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-agentmesh}:${POSTGRES_PASSWORD:-agentmesh}@postgres:5432/${POSTGRES_DB:-agentmesh}
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      OPENSEARCH_USER: ${OPENSEARCH_USER:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-Agentmesh#2026}
      OPENSEARCH_USE_SSL: "false"
      OPENSEARCH_DOCUMENTS_INDEX: ${OPENSEARCH_DOCUMENTS_INDEX:-agentmesh-documents}
    ports: ["8082:8082"]
    depends_on:
      opensearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mcp-memory:
    build:
      context: ./agentservices/mcp/mcp-memory
      dockerfile: Dockerfile
    container_name: agentmesh-mcp-memory
    environment:
      MCP_SERVER_NAME: memory
      MCP_SERVER_PORT: 8083
      MCP_SERVER_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-agentmesh}:${POSTGRES_PASSWORD:-agentmesh}@postgres:5432/${POSTGRES_DB:-agentmesh}
      VECTOR_BACKEND: ${VECTOR_BACKEND:-opensearch}
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      OPENSEARCH_USER: ${OPENSEARCH_USER:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-Agentmesh#2026}
      OPENSEARCH_USE_SSL: "false"
      OPENSEARCH_MEMORY_INDEX: ${OPENSEARCH_MEMORY_INDEX:-agentmesh-longterm-memory}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-agentmesh}
      MONGODB_MEMORY_COLLECTION: longterm_memory
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: text-embedding-3-small
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentmesh-backend
    environment:
      <<: *backend-env
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      minio: { condition: service_healthy }
      litellm: { condition: service_healthy }
      phoenix: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      mcp-documents: { condition: service_healthy }
      mcp-search: { condition: service_healthy }
      mcp-memory: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentmesh-worker
    # -Q ingest: this worker only takes document work. Scale it independently
    # of the API; embedding throughput is the usual bottleneck.
    command: >
      celery -A app.ingestion.celery_app.celery_app worker
      --loglevel=INFO --concurrency=2 -Q ingest,default
      --max-tasks-per-child=50
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.ingestion.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentmesh-flower
    profiles: ["tools"]
    command: celery -A app.ingestion.celery_app.celery_app flower --port=5555
    environment: *backend-env
    ports: ["5555:5555"]
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentmesh-frontend
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_started }
    restart: unless-stopped

  # ---- AI Observability: Arize Phoenix ------------------------------------
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: agentmesh-phoenix
    ports:
      - "6006:6006"    # Phoenix UI
      - "4317:4317"    # OTLP gRPC collector
      - "4318:4318"    # OTLP HTTP collector
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentmesh}:${POSTGRES_PASSWORD:-agentmesh}@postgres:5432/phoenix
      PHOENIX_WORKING_DIR: /phoenix/data
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  # ---- Graph Database: Neo4j -----------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: agentmesh-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/agentmesh2026}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      - "7474:7474"    # Neo4j Browser / HTTP API
      - "7687:7687"    # Bolt protocol
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---- Vector Database: Pinecone Local --------------------------------------
  # In-memory Pinecone emulator for local development. Compatible with the
  # Pinecone Python SDK — just point it at http://localhost:5081.
  # No API key needed. Data is in-memory (lost on restart).
  pinecone:
    image: ghcr.io/pinecone-io/pinecone-local:latest
    container_name: agentmesh-pinecone
    ports:
      # 5081 is the controller; each created index is served on the next free
      # port (5082, 5083, ...), so the whole range must be published.
      - "5081-5090:5081-5090"
    environment:
      PORT: 5081
      PINECONE_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5081/indexes || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ---- Document Database: MongoDB ------------------------------------------
  # Alternative vector backend to OpenSearch. Set VECTOR_BACKEND=mongodb to use.
  # Locally runs as a standalone replica set so Atlas Vector Search $vectorSearch
  # aggregation stages work. In production, use MongoDB Atlas.
  mongodb:
    image: mongo:7
    container_name: agentmesh-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try{rs.status()}catch(e){rs.initiate()}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped


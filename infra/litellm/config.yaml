# LiteLLM proxy configuration for AgentMesh.
#
# The proxy is the single egress point for all model traffic. Every provider
# call goes through this gateway, which gives you: unified logging, spend
# tracking, latency-based routing with fallbacks, rate-limit enforcement,
# and the ability to swap a provider without touching application code.
#
# Local dev: API keys are passed via os.environ from docker-compose.yml.
# Production: mount a secret-injected config or set the env vars in your
# orchestrator (ECS, K8s, etc.).

model_list:

  # ----------------------------------------------------------- Anthropic
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      deployment: third_party
      provider: anthropic
      max_input_tokens: 200000

  - model_name: claude-opus-4-1
    litellm_params:
      model: anthropic/claude-opus-4-1
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      deployment: third_party
      provider: anthropic
      max_input_tokens: 200000

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      deployment: third_party
      provider: anthropic
      max_input_tokens: 200000

  # ----------------------------------------------------------- OpenAI
  - model_name: gpt-4.1
    litellm_params:
      model: openai/gpt-4.1
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      deployment: third_party
      provider: openai
      max_input_tokens: 1000000

  - model_name: gpt-4.1-mini
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      deployment: third_party
      provider: openai
      max_input_tokens: 1000000

  - model_name: o4-mini
    litellm_params:
      model: openai/o4-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      deployment: third_party
      provider: openai
      max_input_tokens: 200000

  # ----------------------------------------------------------- Google
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GOOGLE_API_KEY
    model_info:
      deployment: third_party
      provider: google
      max_input_tokens: 1000000

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GOOGLE_API_KEY
    model_info:
      deployment: third_party
      provider: google
      max_input_tokens: 1000000

  # ----------------------------------------------------------- Embeddings
  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: embedding
      deployment: third_party
      provider: openai

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120
  allowed_fails: 3
  cooldown_time: 30

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 120
  telemetry: false
  json_logs: true
  # Disable message logging for privacy in production.
  turn_off_message_logging: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: false
  disable_spend_logs: true
  max_parallel_requests: 200
  health_check_interval: 60

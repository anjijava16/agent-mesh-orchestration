# Reference edge configuration for a single-host production deployment.
# The frontend image ships its own nginx.conf for the container case; this is
# the terminating proxy you would put in front of the whole stack.

upstream agentmesh_api {
    server backend:8000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name agentmesh.example.com;

    ssl_certificate     /etc/ssl/certs/agentmesh.crt;
    ssl_certificate_key /etc/ssl/private/agentmesh.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 210M;   # must exceed STORAGE_MAX_UPLOAD_BYTES

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    location /api/v1/chat/stream {
        proxy_pass http://agentmesh_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: no buffering, no timeouts. Getting this wrong is the single most
        # common reason a streaming UI appears to hang.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://agentmesh_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

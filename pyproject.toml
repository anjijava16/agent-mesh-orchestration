[project]
name = "refundry"
version = "1.0.0"
description = "A refund resolution network built on MCP and A2A, with a System One model in the routing path"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
jev = ["typesafe-sdk>=0.1"]

[project.scripts]
refundry = "refundry.cli:main"

[tool.setuptools.packages.find]
include = ["refundry*"]

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E731"]
